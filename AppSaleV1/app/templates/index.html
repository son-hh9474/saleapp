<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <title>Trang Chủ</title>

</head>
<body>
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link active" href="/">Trang chủ</a>
            </li>
            {% for c in categories %}
            <li class="nav-item">
                <a class="nav-link" href="/?category_id={{ c.id }}">{{ c.name}}</a>
            </li>
            {% endfor %}
            <li class="nav-item">
                <a class="nav-link" href="/login">Đăng nhập</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/register">Đăng ký</a>
            </li>
        </ul>
        <form method="get" action="/" class="d-flex">
            <input class="form-control me-2" type="text" placeholder="Tìm kiếm sản phẩm" name="kw">
            <button class="btn btn-primary" type="submit">Tìm</button>
        </form>
    </div>
</nav>
<section class="container">
    {% if product %}
    <div class="row">
        {% for p in product %}
        <div class="col-md-3 col-6 p-2">
            <div class="card">
                <img class="card-img-top" src="{{ p.image }}" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{ p.name }}</h4>
                    <p class="card-text">{{ p.price }} VNĐ</p>
                    <a href="#" class="btn btn-primary">xem chi tiết</a>
                    <button href="#" class="btn btn-danger">Đặt hàng</button>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-warning mt-4">Không có sản phẩm nào</div>
    {% endif %}


</section>

<footer>
    <div class="mt-4 p-5 bg-primary text-white rounded">
        <h1>Ecomerce Website</h1>
        <p>&copy; 2026</p>
    </div>
</footer>
</body>
</html>
