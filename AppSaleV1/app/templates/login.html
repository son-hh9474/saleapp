<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <title>Trang Đăng Nhập</title>
</head>
<body>
<div class="container">
    <h1 class="text text-center">ĐĂNG NHẬP</h1>
    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="username" placeholder="điền username" name="username">
        <label for="username">username</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <input type="text" class="form-control" id="password" placeholder="điền password" name="password">
        <label for="password">Password</label>
    </div>
    <div class="text-center">
        <button type="button" class="btn btn-outline-primary rounded-pill">
            Đăng nhập
        </button>
    </div>

    <div class="container">
        <label>No account?</label>
        <a class="text" href="/register">create one :))</a>
    </div>
</div>

</body>
</html>
