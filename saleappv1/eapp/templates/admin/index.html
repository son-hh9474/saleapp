{% extends 'admin/master.html' %}
{% block body %}

{% if current_user.is_authenticated %}

<div class="row">
  <div class="col-2">
    <img src="{{current_user.avatar}}" class="rounded img-fluid">
  </div>
  <div class="col-10">
    <h4 class="text-success">chào {{ current_user.username }}:))</h4>
  </div>
</div>

{% else %}
<h1 class="text-center text-success">ĐĂNG NHẬP QUẢN TRỊ</h1>
<form method="post" action="/login">
  <div class="form-group">
    <label for="username">Email address:</label>
    <input type="text" class="form-control" placeholder="tên đăng nhập" id="username" name="username">
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="mật khẩu" id="pwd" name="password">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endif %}


{% endblock %}
